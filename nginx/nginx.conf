events {}

http {
  server {
    listen 80;
    
    # Block external access to internal routes
    location ~ ^/api/internal/ {
      return 403;
    }
    
    location /api/v1/user/ {
      proxy_pass http://user_service:9001/;
    }

    location /api/v1/property/ {
      proxy_pass http://property_service:9002/;
    }

    location /api/v1/booking/ {
      proxy_pass http://booking_service:9003/;
    }

    location /api/v1/location/ {
      proxy_pass http://location_service:9004/;
    }

    location /docs/user/ {
      proxy_pass http://user_service:9001/docs/;
    }

    location /docs/property/ {
      proxy_pass http://property_service:9002/docs/;
    }

    location /docs/booking/ {
      proxy_pass http://booking_service:9003/docs/;
    }

    location /docs/location/ {
      proxy_pass http://location_service:9004/docs/;
    }

    location / {
      return 404;
    }
  }
}