events {}

http {
  server {
    listen 80;
    
    # Block external access to internal routes
    location ~ ^/api/internal/ {
      return 403;
    }
    
    # Specific routes first (longest match wins)
    location /api/v1/user/ {
      proxy_pass http://user_service:9001/api/v1/;
      proxy_pass_request_headers on;
    }

    location /api/v1/property/ {
      proxy_pass http://property_service:9002/api/v1/property/;
      proxy_pass_request_headers on;
    }

    location /api/v1/booking/ {
      proxy_pass http://booking_service:9003/api/v1/booking/;
      proxy_pass_request_headers on;
    }

    location /api/v1/location/ {
      proxy_pass http://location_service:9004/api/v1/location/;
      proxy_pass_request_headers on;
    }

    location / {
      return 404;
    }
  }
}